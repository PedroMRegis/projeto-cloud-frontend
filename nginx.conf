# Servidor estático da SPA. Roteamento de /api/* NÃO acontece aqui: em
# produção o ALB manda /api/* direto para o chatbot/backend, e esta task só
# recebe o resto (regra padrão do listener).
pid /tmp/nginx.pid;
worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path       /tmp/proxy;
  fastcgi_temp_path     /tmp/fastcgi;
  uwsgi_temp_path       /tmp/uwsgi;
  scgi_temp_path        /tmp/scgi;

  sendfile on;
  server_tokens off;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Log em JSON, uma linha por requisição, para o CloudWatch Logs Insights.
  log_format json escape=json '{"ts":"$time_iso8601","level":"INFO","service":"frontend",'
    '"msg":"requisição concluída","method":"$request_method","path":"$uri",'
    '"status":$status,"duration_ms":$request_time,"correlation_id":"$http_x_request_id"}';
  access_log /dev/stdout json;
  error_log  /dev/stderr warn;

  server {
    listen 8080;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    # Health check do target group do ALB: sem I/O, sem log.
    location = /health {
      access_log off;
      default_type application/json;
      return 200 '{"status":"ok"}';
    }

    # Arquivos com hash no nome nunca mudam: cache de 1 ano.
    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      try_files $uri =404;
    }

    # SPA: toda rota desconhecida devolve o index.html (sem cache, para um
    # deploy novo aparecer na hora).
    location / {
      add_header Cache-Control "no-cache";
      try_files $uri /index.html;
    }
  }
}
